<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperFlip</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="./img/logo_hyperliquid/HL logo_dark green.svg" type="image/png">
    <link rel="stylesheet" type="text/css" href="./css/style.css" >
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" /> <!-- Fonts awesome pour les socials-->

  </head>

<body class="w-100">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
          <a class="navbar-brand" href="/index">
            <img src="img/logo.jpg" height="70" class="d-inline-block align-top rounded-circle" alt="Logo">
          </a>          
          <a class="navbar-brand" href="/index">
            HyperFlip
          </a>  
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto d-flex align-items-center">
                <!-- Statistics -->
                <li class="nav-item d-flex align-items-center">
                    <a class="nav-link text-center" href="stats" style="color: #ffffff;">Statistics</a>
                </li>
        
                <!-- Social Media Icons -->
                <li class="nav-item d-flex align-items-center">
                    <a href="" target="_blank" rel="noopener noreferrer" class="d-flex justify-content-center align-items-center">
                        <i class="fab fa-telegram" style="font-size: 15px; color: #ffffff; margin: 0 10px;"></i>
                    </a>
                    <a href="" target="_blank" rel="noopener noreferrer" class="d-flex justify-content-center align-items-center">
                        <i class="fab fa-discord" style="font-size: 15px; color: #ffffff; margin: 0 10px;"></i>
                    </a>
                    <a href="https://x.com/hypercoinflip" target="_blank" rel="noopener noreferrer" class="d-flex justify-content-center align-items-center">
                        <i class="fab fa-twitter" style="font-size: 15px; color: #ffffff; margin: 0 10px;"></i>
                    </a>
                </li>
        
                <!-- Connect Wallet -->
                <li class="nav-item d-sm-block d-lg-inline">
                    <div class="dropdown">
                        <button id="connectWallet" class="btn btn-primary">Connect Wallet</button>
                        <div id="walletInfo" class="dropdown-content" style="display: none;">
                            <p>HyperEVM balance</p>
                            <p id="testhBalance" style="display: none;"></p>
                            <p id="usdcBalance" style="display: none;"></p>
                            <p id="logoutWallet" style="display: none;">Logout</p>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
        
      </div>
    </nav>

    <div id="networkModal" class="network-modal">
        <div class="network-modal-content">
            <img src="img/logo_hyperliquid/HL symbol_dark green.svg" height="70" class="img-fluid d-inline-block align-top">
            <p>Wrong network. Please change the network.</p>
            <button id="changeNetworkButton">Change</button>
        </div>
    </div>
    
    <!-- Stats Canvas Container -->
    <div class="container mt-5">
      <!-- Centered Card for Volume -->
      <div class="flip-button d-flex justify-content-center align-items-center mb-5">
        <p class="p-volume">Volume : <span id="totalVolume"></span> $</p>
      </div>
      <!-- Stats section-->
      <div class="card-custom w-50 mx-auto">
        <h3 class="card-title text-center text-light mb-4">Statistics</h3>
        <p id="totalBets"></p>
        <p id="totalWins"></p>
        <p>Under construction...</p>
      </div>
    </div>

    <footer class="footer mt-10">
        <div class="container">
            <div class="row">
                <div class="col-sm-4">
                    <!-- Partie gauche -->
                    <p>&copy; 2024 HyperFlip<br/>
                </div>
                <div class="col-sm-4 text-center">
                    <!-- Partie centrale avec la musique et le texte -->

                </div>
                <div class="col-sm-4">
                    <!-- Partie droite avec le logo -->
                    <div class="logo text-right">
                        <img src="img/logo_hyperliquid/HL logo_green and white.svg" alt="Logo Hyperliquid" style="max-width: 200px;">
                    </div>
                </div>
            </div>
        </div>
    </footer>
    
    <!-- JavaScript for game and Twitter login handling -->   
    <script type="module" src="./js/ethers-6.13.4.umd.min.js"></script>
    <script src="./js/config.js"></script> <!-- Import config -->
    <script type="module" src="./js/metamask.js"></script> <!-- Import Metamask js -->
    <script type="module" src="./js/hyperliquid.js"></script> <!-- Import Hyperliquid js -->
    <script type="module" src="./js/game.js"></script>  <!-- Import Game js -->
    <!-- Load jQuery and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>

</body>
</html>
